name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x86_64 installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --target x86_64-pc-windows-msvc --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $toml = Get-Content -Raw Cargo.toml
            if ($toml -match '(?m)^version\s*=\s*"([^"]+)"') {
              $version = $Matches[1]
            } else {
              throw "Could not read version from Cargo.toml"
            }
          }

          if ($version -match '^(\d+\.\d+\.\d+)') {
            $numeric = "$($Matches[1]).0"
          } else {
            $numeric = "0.0.0.0"
          }

          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric_version=$numeric" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $version (numeric: $numeric)"

      - name: Run unit tests
        shell: pwsh
        run: cargo test --locked

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @(
            (Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source),
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          New-Item -ItemType Directory -Force -Path installers | Out-Null

          $binary = (Resolve-Path "target\x86_64-pc-windows-msvc\release\DefaultFast.exe").Path
          $outDir = (Resolve-Path "installers").Path
          $version = "${{ steps.version.outputs.app_version }}"
          $numeric = "${{ steps.version.outputs.numeric_version }}"
          $baseName = "DefaultFast-$version-windows-x86_64"

          $isccArgs = @(
            "/DAppVersion=$version",
            "/DNumericVersion=$numeric",
            "/DBinaryPath=$binary",
            "/DOutputDir=$outDir",
            "/DOutputBaseFilename=$baseName"
          )

          $icon = Get-ChildItem -Path "target\x86_64-pc-windows-msvc\release\build" -Filter "defaultfast.ico" -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if ($icon) {
            $isccArgs += "/DIconPath=$icon"
          }

          $isccArgs += "installer\defaultfast.iss"
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Get-ChildItem -Path installers

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installers/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers artifact
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
