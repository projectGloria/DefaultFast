[package]
name = "defaultfast"
# Single source of truth for the version: shown in About, the title-bar tooltip and the
# exe's VERSIONINFO resource. Bump on every change (see CHANGELOG.md).
version = "0.1.0-beta.4"
edition = "2021"
rust-version = "1.88"
description = "Set and repair Windows default apps"
license = "MIT"
build = "build.rs"

[[bin]]
name = "DefaultFast"
path = "src/main.rs"

[dependencies]
# Software renderer + winit: smallest binary and RAM of the Slint renderers (see README).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
thiserror = "2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
