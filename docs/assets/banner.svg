<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="50%" stop-color="#202020" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#005FB8" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow)" />
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#ffffff15" stroke-width="1" />

  <!-- App Icon -->
  <g transform="translate(100, 108)">
    <rect width="144" height="144" rx="32" fill="url(#iconGrad)" />
    <polyline points="40,76 62,98 104,52" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text Content -->
  <g transform="translate(284, 130)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif">
    <!-- Title -->
    <text x="0" y="32" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5px">DefaultFast</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="74" font-size="20" font-weight="400" fill="#A0A0A0">Instant default app manager &amp; association repair utility for Windows 10 &amp; 11</text>

    <!-- Feature badges -->
    <g transform="translate(0, 102)" font-size="13" font-weight="500">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="30" rx="6" fill="#2B2B2B" stroke="#ffffff1a" stroke-width="1" />
        <text x="90" y="19" fill="#60CDFF" text-anchor="middle">Portable Single Exe</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(192, 0)">
        <rect width="170" height="30" rx="6" fill="#2B2B2B" stroke="#ffffff1a" stroke-width="1" />
        <text x="85" y="19" fill="#E0E0E0" text-anchor="middle">Zero Dependencies</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(374, 0)">
        <rect width="160" height="30" rx="6" fill="#2B2B2B" stroke="#ffffff1a" stroke-width="1" />
        <text x="80" y="19" fill="#E0E0E0" text-anchor="middle">&lt; 100 ms Startup</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(546, 0)">
        <rect width="185" height="30" rx="6" fill="#2B2B2B" stroke="#ffffff1a" stroke-width="1" />
        <text x="92" y="19" fill="#6CCB5F" text-anchor="middle">Safe Automatic Undo</text>
      </g>
    </g>
  </g>
</svg>
